name: mobile-api-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest httpx
      - name: Personal-data scan
        run: python scripts/scan_pii.py
      - name: Mobile API tests
        run: python -m pytest tests/mobile -q
