name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Backend & Restart Service
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/fikarta/fikarta-backend
            sudo git config --global --add safe.directory '*'
            sudo git pull origin main
            if [ -f "requirements.txt" ]; then
              ./venv/bin/pip install -r requirements.txt
            fi
            sudo systemctl restart fikarta-backend
            sudo systemctl status fikarta-backend --no-pager
            echo "Backend successfully updated and restarted on EC2!"

